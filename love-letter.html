<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>surprise</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f3e8ff 0%, #ffffff 45%, #e9d5ff 75%, #c084fc 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    padding: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(147, 51, 234, 0.15);
  }

  h1 {
    color: #6b21a8;
    font-size: 1.6em;
    margin-bottom: 8px;
    font-weight: 400;
  }

  p.subtitle {
    color: #9333ea;
    margin-bottom: 28px;
    font-size: 0.95em;
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid #d8b4fe;
    font-size: 1em;
    outline: none;
    background: rgba(255,255,255,0.8);
    color: #4c1d95;
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="text"]:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
  }

  .error {
    color: #a855f7;
    font-size: 0.85em;
    margin-top: 10px;
    min-height: 18px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .error.show { opacity: 1; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(107, 33, 168, 0.35);
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }

  .overlay.show {
    display: flex;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .letter {
    background: #fffaf5;
    border-radius: 4px;
    padding: 44px 38px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    position: relative;
    animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: 85vh;
    overflow-y: auto;
  }

  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .letter h2 {
    color: #be185d;
    font-weight: 400;
    text-align: center;
    margin-top: 0;
    font-size: 1.4em;
  }

  .letter p {
    color: #57534e;
    line-height: 1.8;
    font-size: 1.02em;
  }

  .signature {
    text-align: right;
    margin-top: 24px;
    font-style: italic;
    color: #be185d;
  }

  .close-btn {
    display: block;
    margin: 28px auto 0;
    background: #f9a8d4;
    color: #831843;
    border: none;
    padding: 10px 26px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9em;
    font-family: inherit;
  }

  .close-btn:hover { background: #f472b6; }
</style>
</head>
<body>

  <div class="card">
    <h1>Enter your name</h1>
    <p class="subtitle">just your name, nothing else</p>
    <input type="text" id="username" placeholder="Type here..." autocomplete="off">
    <div class="error" id="error">That's not quite the right name.</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="letter">
      <h2 id="letterHeading">My dearest,</h2>
      <div id="letterBody"></div>
      <div class="signature" id="letterSignature">— always yours</div>
      <button class="close-btn" id="closeBtn">close</button>
    </div>
  </div>

<script>
  // Add as many names as you like. Each key is the trigger name (lowercase),
  // and its value is that person's letter: heading, an array of paragraphs, and a signature.
  const LETTERS = {
    "thkfvk": {
      heading: "My dearest, Yen",
      paragraphs: [
        "Since the start, you were the one I had my eyes on, the one I wanted but I was such a coward and we have not met yet/don't know each other yet.",
        "It may sound like a lie, but it is true, i love your humor, your corny jokes, I haven't seen you that well yet, but when I got a glimpse of you, I've fallen harder.",
        "I don't have the courage to tell you at any time, ikaw pinaparinggan ko sa mga nasabi ko. This is my way of showing how people matter to me."
      ],
      signature: "— always yours, Sota"
    },
  };
  const LETTERS1 = {
    "glimpesofme.com": {
      heading: "My dearest, Somi",
      paragraphs: [
        "I will forever be grateful for the time you accepted me in your group, and for the time you spent with me. I know I am not the best person to be around, but you still accepted me.",
        "You are the reason why I have best people surrounding me, to protect and support me. I am honored to be your baby.",
        "Thank you for being such an incredible person and for always being there for me through thick and thin. I will always be here for you, no matter what happens. I am so proud of you and all that you have accomplished."
      ],
      signature: "— as always, Sota"
    },
  };

    const LETTERS2 = {
    "elxtro221": {
      heading: "Minamahal kong tropa, Lex",
      paragraphs: [
        "Salamat sa pagiging supportive mo kahit na nag gagaguhan lang tayo, salamat rin  dahil sa mga oras na pinaramdam mo na may tropa akong hindi ako bibiguin.",
        "Isa ka sa mga mabubuti kong kaibigan, humihingi ako ng pasensiya sa mga nasabi at nagawa kong mali sayo, hindi ko alam kung okay ba tayo e.",
        "Sana malagpasan mo pinagdadaanan mo ngayon, mahal na mahal kita, bilang lalaking kapatid na hinihingi ko."
      ],
      signature: "— with love, Sota"
    },
  };
  
      const LETTERS3 = {
    "so_yaa_": {
      heading: "The best sister/kuya,",
      paragraphs: [
        "Thank you for the endless advice you gave me, it made me think and it changed my view of the certain parts of my life.",
        "I love how our humor connects at the right time and we joke around as time passed by.",
        "I will keep the wisdom and knowledge you shared in a special place in my heart. Godspeed, brother."
      ],
      signature: "— with love, Sota"
    },
  };

  const LETTERS4 = {
    "reiryzz": {
      heading: "An apology, ",
      paragraphs: [
        "Tol, I am sorry for the things I did and said that hurt you. I know I have made mistakes, and I want to take this opportunity to apologize sincerely.",
        "I know that I have let you down, and I want to make things right. I hope you can find it in your heart to forgive me.",
        "I value our friendship and I want to continue to be a good friend to you. I will do my best to make amends and be a better person moving forward."
      ],
      signature: "— with gratitude, Sota"
    },
  };

  const LETTER_GROUP = {
    names: ["scopoou", "llvhnz", "cle3ent_"],
    heading: "To my seductive daughters,",
    paragraphs: [
      "Thank you for being there for me despite the things I did, and for being the most amazing daughters I could ever ask for.",
      "All of you showed me support on things I never thought I would have done without you, and I am forever grateful for that.",
      "I love all of you, as daughters, sisters, and friends. I will always be here for you, no matter what happens. I am so proud of each and every one of you."
    ],
    signature: "— with all my heart, Sota"
  };

  const input = document.getElementById('username');
  const error = document.getElementById('error');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');
  const letterHeading = document.getElementById('letterHeading');
  const letterBody = document.getElementById('letterBody');
  const letterSignature = document.getElementById('letterSignature');

  function showLetter(letter) {
    letterHeading.textContent = letter.heading;
    letterBody.innerHTML = letter.paragraphs.map(p => `<p>${p}</p>`).join('');
    letterSignature.textContent = letter.signature;
    overlay.classList.add('show');
  }

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const value = input.value.trim().toLowerCase();
      const letter = LETTERS[value];
      const letter1 = LETTERS1[value];
      const letter2 = LETTERS2[value];
      const letter3 = LETTERS3[value];
      const letter4 = LETTERS4[value];
      const letters = LETTER_GROUP.names.includes(value) ? LETTER_GROUP : null;
      if (letter) {
        error.classList.remove('show');
        showLetter(letter);
      } else if (letter1) {
        error.classList.remove('show');
        showLetter(letter1);
      } else if (letter2) {
        error.classList.remove('show');
        showLetter(letter2);
      } else if (letter3) {
        error.classList.remove('show');
        showLetter(letter3);
      } else if (letter4) {
        error.classList.remove('show');
        showLetter(letter4);
      }  else if (letters) {
        error.classList.remove('show');
        showLetter(letters);
      } else if (value.length > 0) {
        error.classList.add('show');
      }}
  });
  
  input.addEventListener('input', function() {
    error.classList.remove('show');
  });

  closeBtn.addEventListener('click', function() {
    overlay.classList.remove('show');
    input.value = '';
  });

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) {
      overlay.classList.remove('show');
      input.value = '';
    }
  });
</script>

</body>
</html>
